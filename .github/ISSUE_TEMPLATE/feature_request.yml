name: Feature request
description: Suggest something LuneDB should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        LuneDB is local-first by design: no accounts, no cloud sync, no telemetry.
        Requests that need user data to leave the machine are out of scope.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that LuneDB makes hard today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: How you imagine it working. Rough is fine.

  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it now
      description: Another tool, a manual step, or nothing at all.
